name: Validate personal blog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content sources
        run: python scripts/check_content.py
      - name: Build production site
        run: bundle exec jekyll build --strict_front_matter
      - name: Check Jekyll configuration
        run: bundle exec jekyll doctor
      - name: Check generated links and metadata
        run: python scripts/check_site.py _site --origin https://mickpunungwe3000.github.io
      - name: Verify production and private-preview isolation
        run: bundle exec ruby scripts/verify_draft_isolation.rb
